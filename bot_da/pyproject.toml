[project]
name = "bot-da"
version = "0.1.0"
description = "DonationAlerts integration bot for OpenPlaylist"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faststream[cli,rabbit]>=0.5.48",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "uuid6>=2025.0.1",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
