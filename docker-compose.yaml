volumes:
  postgres_data:
    driver: local

  rabbitmq_data:
    driver: local

  redis_data:
    driver: local

  caddy_data:
  caddy_config:

networks:
  default:
    driver: bridge

services:

  rabbitmq:
    image: rabbitmq:4.1.2-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - default
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - default
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 3s
      retries: 30

  database:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openplaylist_mono_user -d openplaylist_mono" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5438:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Для поддержки HTTP/3 (опционально)
    dns:
    - 8.8.8.8
    - 1.1.1.1
    environment:
      PROJECT_DOMAIN: "${PROJECT_DOMAIN:-openplaylist.localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - default

  backend:
    build: ./back-end
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./back-end/.env
    ports:
      - "8000:8000"
    volumes:
      - ./back-end/src:/app/src
      - ./back-end/alembic.ini:/app/alembic.ini
      - ./back-end/alembic:/app/alembic
      - ./back-end/main.py:/app/main.py
    networks:
      - default
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').getcode()" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

    stop_grace_period: 30s

  task-worker:
    build:
      context: ./back-end
      dockerfile: ./Dockerfile.tasks
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./back-end/.env
    volumes:
      - ./back-end/src:/app/src
    networks:
      - default

  task-schuduler:
    build:
      context: ./back-end
      dockerfile: ./Dockerfile.scheduler
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./back-end/.env
    volumes:
      - ./back-end/src:/app/src
    networks:
      - default

  bot-ttv:
    build:
      context: ./bot_ttv
      dockerfile: ./Dockerfile
    env_file:
      - ./bot_ttv/.env
    volumes:
      - ./bot_ttv/src:/app/src
      - ./bot_ttv/main.py:/app/main.py
    networks:
      - default

  bot-donatex:
    build:
      context: ./bot_donatex
      dockerfile: ./Dockerfile
    env_file:
      - ./bot_donatex/.env
    volumes:
      - ./bot_donatex/src:/app/src
      - ./bot_donatex/main.py:/app/main.py
    networks:
      - default

  bot-da:
    build:
      context: ./bot_da
      dockerfile: ./Dockerfile
    env_file:
      - ./bot_da/.env
    volumes:
      - ./bot_da/src:/app/src
    networks:
      - default

  frontend:
    build:
      context: ./new_ui
      dockerfile: Dockerfile
    networks:
      - default
