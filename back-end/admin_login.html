<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Stealth Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 360px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1.25rem;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: none;
            background: #0284c7;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>SQLAdmin Stealth Login Prod</h2>
        <form action="https://theopenplaylist.com/api/admin/login" method="POST">
            <input type="password" name="password" placeholder="Enter Admin Password" value="" required autofocus>
            <button type="submit">Login to Admin</button>
        </form>
        <h2>SQLAdmin Stealth Login Dev</h2>
        <form action="http://localhost:8000/api/admin/login" method="POST">
            <input type="password" name="password" placeholder="Enter Admin Password" value="" required autofocus>
            <button type="submit">Login to Admin</button>
        </form>
    </div>
</body>
</html>
